name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile scripts
        run: python -m compileall -q skills tests
      - name: Validate rules JSON
        run: python -c "import json; json.load(open('skills/yandex-disk-downloads-sort/assets/rules.default.json', encoding='utf-8'))"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  installer:
    name: Installer script
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n install.sh
      - name: ShellCheck
        # Preinstalled on the Ubuntu runner; installing it on macOS would cost a minute
        # for a check whose result cannot differ between the two.
        if: runner.os == 'Linux'
        run: shellcheck -s bash install.sh
      - name: Install into a throwaway HOME, non-interactively
        run: |
          mkdir -p "${RUNNER_TEMP}/fakehome"
          env -i HOME="${RUNNER_TEMP}/fakehome" PATH="$PATH" NONINTERACTIVE=1 \
            bash install.sh --no-token < /dev/null
          skill="${RUNNER_TEMP}/fakehome/.local/share/yandex-disk-downloads-sort/yandex-disk-downloads-sort"
          test -f "${skill}/SKILL.md"
          test -f "${skill}/VERSION"
          test -L "${RUNNER_TEMP}/fakehome/.claude/skills/yandex-disk-downloads-sort"
          test -L "${RUNNER_TEMP}/fakehome/.agents/skills/yandex-disk-downloads-sort"
          python3 "${skill}/scripts/downloads_sort.py" --help > /dev/null
          python3 -c "import json,os,sys; s=json.load(open(os.environ['RUNNER_TEMP']+'/fakehome/.claude/settings.json')); sys.exit(0 if s['env']['YANDEX_DISK_TOKEN_FILE'].endswith('.yandex-disk-token') else 1)"
      - name: Re-run is idempotent and writes a token file with mode 600
        run: |
          env -i HOME="${RUNNER_TEMP}/fakehome" PATH="$PATH" NONINTERACTIVE=1 \
            YANDEX_DISK_TOKEN=y0_not_a_real_token bash install.sh < /dev/null
          token="${RUNNER_TEMP}/fakehome/.yandex-disk-token"
          # GNU first: on GNU coreutils `stat -f` means --file-system and would print
          # filesystem details before failing, polluting the captured value.
          mode=$(stat -L -c '%a' "${token}" 2>/dev/null || stat -L -f '%Lp' "${token}")
          test "${mode}" = "600"
      - name: An unusable release URL fails loudly instead of half-installing
        run: |
          mkdir -p "${RUNNER_TEMP}/emptyhome"
          out=$(env -i HOME="${RUNNER_TEMP}/emptyhome" PATH="$PATH" NONINTERACTIVE=1 \
            YADISK_VERSION=v0.0.0-does-not-exist bash install.sh --no-token < /dev/null 2>&1) && exit 1
          echo "${out}" | grep -q "could not download"
          test ! -e "${RUNNER_TEMP}/emptyhome/.claude/skills/yandex-disk-downloads-sort"

  openapi:
    name: Validate GPT action schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator pyyaml
      - run: openapi-spec-validator chatgpt/openapi.yaml
      - run: python tests/check_openapi_limits.py chatgpt/openapi.yaml
